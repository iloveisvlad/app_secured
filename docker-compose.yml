services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: taskops-nginx:secured
    container_name: taskops_nginx_secured
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8080"
    networks:
      - frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 128m
    cpus: "0.25"
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: taskops-board-api:secured
    container_name: taskops_api_secured
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./uploads:/app/uploads:rw
      - ./exports:/app/reports:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - frontend
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m
    cpus: "0.75"
    ulimits:
      nofile:
        soft: 1024
        hard: 4096

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: taskops-board-worker:secured
    container_name: taskops_worker_secured
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./exports:/app/reports:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    cpus: "0.50"
    ulimits:
      nofile:
        soft: 1024
        hard: 4096

  postgres:
    image: postgres:13
    container_name: taskops_postgres_secured
    user: "999:999"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=64m,mode=1777,uid=999,gid=999
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 768m
    cpus: "0.75"
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    build:
      context: .
      dockerfile: redis/Dockerfile
    image: taskops-redis:secured
    container_name: taskops_redis_secured
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    cpus: "0.50"
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  frontend:
  backend:
    internal: true